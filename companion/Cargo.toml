[package]
name = "hawaos-companion"
version = "0.5.0"
edition = "2024"
description = "HawaOS Desktop Companion Application & Tray Daemon for LilyGo T-Display-S3"
license = "MIT"

[dependencies]
aes-gcm = { version = "0.11.1", features = ["getrandom"] }
base64 = "0.22"
btleplug = "0.13.5"
futures = "0.3.34"
getrandom = "0.3"
gpui-kit = "0.8.0"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }
ksni = { version = "0.3", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.10.1", default-features = false }
sha1 = "0.11.0"
sha2 = "0.10"
sysinfo = "0.39.6"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
ureq = "3.5.0"
uuid = "1"
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }
