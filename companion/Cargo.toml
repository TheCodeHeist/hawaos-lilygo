[package]
name = "hawaos-companion"
version = "0.8.0"
edition = "2024"
description = "HawaOS Desktop Companion Application & Tray Daemon for LilyGo T-Display-S3"
license = "MIT"

[dependencies]
aes-gcm = { version = "0.11.1", features = ["getrandom"] }
base64 = "0.22"
btleplug = "0.13.5"
cosmic-text = "0.19"
futures = "0.3.34"
getrandom = "0.3"
gpui-kit = "0.8.0"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.10.1", default-features = false }
sha1 = "0.11.0"
sha2 = "0.10"
sysinfo = "0.39.6"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
unicode-normalization = "0.1"
ureq = "3.5.0"
uuid = "1"
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }

# The tray over StatusNotifierItem (D-Bus).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

# Media sessions (WinRT), the WLAN API, autostart in the registry, the tray.
# windows 0.62 is the version gpui, btleplug and sysinfo already use.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_NetworkManagement_WiFi",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.6"
tray-icon = "0.26"

[build-dependencies]
winresource = "0.1"
