# The Linux companion as .deb, .rpm and AppImage: built on Ubuntu 22.04 (glibc 2.35, so
# the binary runs on every current distribution), installed on several
# distributions to check the dependencies resolve, and attached to each
# published release (tools/release.sh publishes the Flatpak; this adds the
# rest).
name: Linux packages

on:
  push:
    branches: [main]
    paths:
      - "companion/**"
      - "assets/**"
      - "packaging/linux/**"
      - "packaging/flatpak/*.desktop"
      - "packaging/flatpak/*.metainfo.xml"
      - "packaging/flatpak/*.png"
      - "install.sh"
      - ".github/workflows/linux.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # attaching the packages to a release

env:
  NFPM_VERSION: 2.48.0
  NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Build tools and libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libdbus-1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libfreetype-dev libfontconfig-dev \
            playerctl dbus file

      - uses: actions/checkout@v4

      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion

      - name: Test
        working-directory: companion
        run: cargo test --locked

      - name: Build
        working-directory: companion
        run: |
          cargo build --release --locked
          # The oldest glibc it asks for decides where it runs.
          objdump -T target/release/hawaos-companion | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - name: Packages
        run: |
          curl -fsSL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  nfpm.tar.gz" | sha256sum -c -
          tar xzf nfpm.tar.gz nfpm
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' companion/Cargo.toml | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          VERSION=$VERSION ./nfpm pkg -f packaging/linux/nfpm.yaml -p deb -t dist/
          VERSION=$VERSION ./nfpm pkg -f packaging/linux/nfpm.yaml -p rpm -t dist/
          ls -l dist

      - name: AppImage
        run: |
          packaging/linux/build-appimage.sh "$VERSION" dist/
          (cd dist && sha256sum *.deb *.rpm *.AppImage > SHA256SUMS-linux)

      - uses: actions/upload-artifact@v4
        with:
          name: hawaos-companion-linux-packages
          path: dist/*

  # Installs the package the way users do, through install.sh (which picks
  # the .deb or .rpm, checks its checksum and runs the package manager; that
  # fails if a dependency doesn't resolve), then checks every library the
  # binary links or loads is there, then updates through install.sh again.
  install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            tools: apt-get update && apt-get install -y curl
          - image: ubuntu:24.04
            tools: apt-get update && apt-get install -y curl
          - image: debian:12
            tools: apt-get update && apt-get install -y curl
          - image: fedora:latest
            tools: dnf install -y curl
          - image: opensuse/tumbleweed
            tools: zypper --non-interactive install curl
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hawaos-companion-linux-packages
          path: dist

      - name: Tools
        run: ${{ matrix.tools }}

      - name: Install (install.sh)
        run: HAWAOS_RELEASE_DIR=dist bash install.sh

      - name: Check
        run: |
          set -e
          test -x /usr/bin/hawaos-companion
          test -f /usr/lib/udev/rules.d/70-hawaos.rules
          if ldd /usr/bin/hawaos-companion | grep 'not found'; then exit 1; fi
          # Loaded at run time rather than linked.
          for lib in libvulkan.so.1 libwayland-client.so.0 libwayland-egl.so.1 libEGL.so.1; do
            ldconfig -p | grep -q "$lib" || { echo "missing $lib"; exit 1; }
          done
          for tool in playerctl dbus-monitor stdbuf; do
            command -v "$tool" >/dev/null || { echo "missing $tool"; exit 1; }
          done
          echo "OK on ${{ matrix.image }}"

      - name: Update (install.sh again)
        run: HAWAOS_RELEASE_DIR=dist bash install.sh

  # Unpacks the AppImage on a stock Ubuntu runner and checks the companion's
  # libraries resolve and the bundled tools run.
  appimage:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hawaos-companion-linux-packages
          path: dist

      - name: Check
        run: |
          set -e
          chmod +x dist/*.AppImage
          dist/*.AppImage --appimage-extract >/dev/null
          cd squashfs-root
          test -x AppRun
          test -f dev.is_a.thecodeheist.HawaOSCompanion.desktop
          sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0
          if ldd usr/bin/hawaos-companion | grep 'not found'; then exit 1; fi
          usr/libexec/hawaos/playerctl --version
          usr/libexec/hawaos/dbus-monitor --help > help.txt 2>&1 || true
          grep -q 'dbus-monitor' help.txt
          # The update information AppImageUpdate reads. (No pipe into grep -q:
          # the runner's shell has pipefail, and strings would get SIGPIPE.)
          strings ../dist/*.AppImage > strings.txt
          grep -q 'gh-releases-zsync|TheCodeHeist|hawaos-lilygo' strings.txt
          test -f ../dist/*.AppImage.zsync
          echo "AppImage OK"

  release:
    if: github.event_name == 'release'
    needs: [install, appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hawaos-companion-linux-packages
          path: dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release upload "${{ github.event.release.tag_name }}" *.deb *.rpm *.AppImage *.zsync SHA256SUMS-linux \
            --clobber --repo "${{ github.repository }}"
