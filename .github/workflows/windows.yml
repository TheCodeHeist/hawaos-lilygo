# The Windows companion: tests and a release build on every change, the
# installer as a downloadable artifact, and attached to each published
# release (tools/release.sh publishes the Linux files; this adds Windows).
name: Windows companion

on:
  push:
    branches: [main]
    paths:
      - "companion/**"
      - "assets/**"
      - "packaging/windows/**"
      - "install.ps1"
      - ".github/workflows/windows.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # attaching the installer to a release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup update stable --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion

      - name: Test
        working-directory: companion
        run: cargo test --locked

      - name: Build
        working-directory: companion
        run: cargo build --release --locked

      - name: Installer
        run: |
          $version = (Select-String -Path companion/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc /DAppVersion=$version packaging/windows/hawaos-companion.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # install.ps1 as users run it (piped into iex, in Windows PowerShell
      # 5.1), with this installer: a first install, then an update after the
      # user switched autostart off (it must stay off), then uninstall.
      - name: Install script
        shell: powershell
        env:
          HAWAOS_NO_LAUNCH: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $env:HAWAOS_SETUP = "dist/hawaos-companion-$env:VERSION-windows-x64-setup.exe"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{56F6AE17-FD41-4877-9265-22F68EC5CBEA}_is1"
          $run = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          function Installed { (Get-ItemProperty $key -ErrorAction SilentlyContinue).DisplayVersion }
          function Autostart { [bool](Get-ItemProperty $run -Name "HawaOS Companion" -ErrorAction SilentlyContinue) }

          Get-Content install.ps1 -Raw | Invoke-Expression
          if ((Installed) -ne $env:VERSION) { throw "first install: version is '$(Installed)'" }
          if (-not (Autostart)) { throw "first install: autostart wasn't set up" }
          $exe = Join-Path (Get-ItemProperty $key).InstallLocation "hawaos-companion.exe"
          if (-not (Test-Path $exe)) { throw "first install: $exe is missing" }

          Remove-ItemProperty $run -Name "HawaOS Companion"
          Get-Content install.ps1 -Raw | Invoke-Expression
          if ((Installed) -ne $env:VERSION) { throw "update: version is '$(Installed)'" }
          if (Autostart) { throw "update: autostart came back on" }

          $uninstaller = Join-Path (Get-ItemProperty $key).InstallLocation "unins000.exe"
          Start-Process $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          # The uninstaller hands over to a copy of itself and returns early.
          for ($i = 0; (Installed) -and $i -lt 30; $i++) { Start-Sleep -Seconds 1 }
          if (Installed) { throw "uninstall: still registered" }
          Write-Host "install.ps1: install, update and uninstall OK"

      - uses: actions/upload-artifact@v4
        with:
          name: hawaos-companion-${{ env.VERSION }}-windows-x64
          path: |
            dist/hawaos-companion-*-windows-x64-setup.exe
            companion/target/release/hawaos-companion.exe

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "dist/hawaos-companion-$env:VERSION-windows-x64-setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $setup -Leaf)" | Out-File -FilePath dist/SHA256SUMS-windows -Encoding ascii
          gh release upload "${{ github.event.release.tag_name }}" $setup dist/SHA256SUMS-windows --clobber
